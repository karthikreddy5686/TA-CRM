<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flux-icon.png" />
    <link rel="apple-touch-icon" href="/flux-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Flux TA CRM | Talent Acquisition Web App</title>
    <meta name="description" content="Campus recruitment CRM web application for HR teams featuring TPO outreach, student data ingestion, drive trackers, and in-app calling." />
    <!-- Web App & PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Flux TA CRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flux CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#09090b" />
    <!-- Google Fonts: Public Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="flux-initial-splash" style="position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;">
        <div style="display:flex;align-items:center;margin-bottom:12px;">
          <span style="font-size:2.4rem;font-weight:900;color:#ffffff;letter-spacing:-0.04em;">flu<span style="color:#facc15;">X</span></span>
        </div>
        <div style="font-size:0.75rem;font-weight:700;color:#94a3b8;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:24px;">
          Talent Acquisition CRM
        </div>
        <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.12);border-top-color:#facc15;border-radius:50%;animation:fluxSplashSpin 0.7s linear infinite;"></div>
        <style>
          @keyframes fluxSplashSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
